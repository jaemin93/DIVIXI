[package]
name = "orchestra-app"
version.workspace = true
edition.workspace = true

# The executable is the product: divixi.exe in the task bar and the task
# manager. The crate keeps its orchestra-* name.
[[bin]]
name = "divixi"
path = "src/main.rs"

[lib]
name = "orchestra_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
futures.workspace = true
orchestra-acp = { path = "../crates/acp" }
orchestra-agents = { path = "../crates/agents" }
orchestra-core = { path = "../crates/orchestra" }
orchestra-knowledge = { path = "../crates/knowledge" }
orchestra-mcp = { path = "../crates/mcp" }
orchestra-store = { path = "../crates/store" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Remote access (src/remote): the server, signed tokens, the pairing QR.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
hmac = "0.12"
sha2 = "0.10"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
ignore = "0.4"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
portable-pty = "0.9.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls"] }
base64 = "0.23.1"
imagesize = "0.13"

[dev-dependencies]
# A mock app for the remote bridge's tests.
tauri = { version = "2", features = ["tray-icon", "test"] }
