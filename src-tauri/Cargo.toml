[package]
name = "orchestra-app"
version.workspace = true
edition.workspace = true

# The executable is the product: divixi.exe in the task bar and the task
# manager. The crate keeps its orchestra-* name.
[[bin]]
name = "divixi"
path = "src/main.rs"

[lib]
name = "orchestra_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
orchestra-acp = { path = "../crates/acp" }
orchestra-agents = { path = "../crates/agents" }
orchestra-core = { path = "../crates/orchestra" }
orchestra-mcp = { path = "../crates/mcp" }
orchestra-store = { path = "../crates/store" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
ignore = "0.4"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
