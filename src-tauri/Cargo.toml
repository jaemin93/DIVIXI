[package]
name = "orchestra-app"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
description.workspace = true
# `cargo run` (and so `tauri dev`) runs the desktop app, not divixi-server.
default-run = "divixi"

# The executable is the product: divixi.exe in the task bar and the task
# manager. The crate keeps its orchestra-* name.
[[bin]]
name = "divixi"
path = "src/main.rs"

# Divixi with no window, for a server: the same app on Tauri's mock runtime
# (see src/bin/divixi-server.rs).
[[bin]]
name = "divixi-server"
path = "src/bin/divixi-server.rs"
required-features = ["server"]

[features]
# custom-protocol: embed dist/ in the binary, as `tauri build` does for the
# app. A phone loads the UI from divixi-server, and without it Tauri builds
# in development mode and reads dist/ from the build machine's checkout at
# run time, which no server has (#77). scripts/check-server-ui.sh checks it.
server = ["tauri/test", "tauri/custom-protocol"]

[lib]
name = "orchestra_app"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
futures.workspace = true
orchestra-acp = { path = "../crates/acp" }
orchestra-agents = { path = "../crates/agents" }
orchestra-core = { path = "../crates/orchestra" }
orchestra-knowledge = { path = "../crates/knowledge" }
orchestra-mcp = { path = "../crates/mcp" }
orchestra-store = { path = "../crates/store" }
parking_lot.workspace = true
serde.workspace = true
serde_json.workspace = true
# unstable: more than one webview in a window (a warm one per remote instance).
tauri = { version = "2", features = ["tray-icon", "unstable"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
# Remote instances (src/remote): the server and its signed tokens.
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws", "query"] }
hmac = "0.13"
sha2 = "0.11"
ignore = "0.4"
# The remote instance's event socket, from this app (axum's own WebSocket crate).
tokio-tungstenite = "0.30"
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
time.workspace = true
uuid.workspace = true
sysinfo = { version = "0.39.6", default-features = false, features = ["system", "disk"] }
portable-pty = "0.9.0"
# "stream": both downloads read the body chunk by chunk rather than whole.
# The app's own installer, for a progress bar and so a cancel takes effect
# between chunks (src/update.rs); the remote install, to push the server
# binary over SSH as it arrives (src/remote/install.rs) rather than holding
# 207 MB in memory.
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream"] }
base64 = "0.23.1"
imagesize = "0.15"
# `divixi-server phone link` draws its link as a QR code in the terminal.
# Without default features it has no dependencies of its own (the defaults
# pull in `image`).
qrcode = { version = "0.14", default-features = false }
# Schedules are given in the machine's own local time ("daily at 07:10"),
# and what the app says about them is read by a person in that time: the
# one clock in the workspace with a local offset that is sound to ask from
# any thread (src/schedule.rs). Already in the tree through other crates.
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# A watched job's "done" line is a regular expression (src/jobs.rs).
regex = "1"
# A worker's allowed paths are globs over the track folder (src/scope.rs).
globset = "0.4"
# Whether two spellings of a folder are one folder on disk, for a file
# system that may or may not ignore case (src/scope.rs). Already in the
# tree through other crates.
same-file = "1"

[target.'cfg(unix)'.dependencies]
# Whether a process is still alive, by pid (`kill(pid, 0)`): what tells a
# run the app lost from one whose agent went on alone, and a watched job
# that ended from one still going.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
# The terminal's PATH, read from the registry as Windows keeps it (src/windows_path.rs).
winreg = "0.56.0"

[dev-dependencies]
# A mock app for the remote bridge's tests.
tauri = { version = "2", features = ["tray-icon", "unstable", "test"] }
