# Blank issues stay enabled. Maintainer chores, questions and documentation notes fit
# neither form, and pushing them through the bug template only produces empty sections.
# The forms are there to steer the reports where the missing information actually costs a
# round trip -- a bug without diagnostics.
blank_issues_enabled: true

contact_links:
  - name: 🔒 Security vulnerability
    url: https://github.com/jaemin93/divixi/security/advisories/new
    about: Report it privately, not as an issue. See SECURITY.md for what to include.
  - name: 📖 Building and working on DIVIXI
    url: https://github.com/jaemin93/divixi/blob/main/CONTRIBUTING.md
    about: Setup, the checks to run, and what CI does and does not prove.
