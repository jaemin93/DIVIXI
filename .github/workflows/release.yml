# Builds the installers for a release and attaches them to a GitHub Release.
#
# Versioning, as decided: the manifests keep plain semver (package.json,
# Cargo.toml, tauri.conf.json all stay 0.1.0 and move on their own schedule),
# and the *release* is named by date. The date is read from the tag; nothing in
# the repository is rewritten by this workflow.
#
#   git tag v2026-09-27   && git push origin v2026-09-27     -> "2026-09-27"
#   git tag v2026-09-27.2 && git push origin v2026-09-27.2   -> "2026-09-27 (2)"
#
# A tag that does not match that shape fails the `prepare` job with a message
# saying what was expected, before any machine spends twenty minutes compiling.
#
# Three ways in:
#
#   push of a v* tag   a person cut the release; the date comes from the tag
#   schedule           nightly at 07:00 in Seoul; `prepare` makes the tag
#   workflow_dispatch  the same as the nightly, on demand
#
# ## The nightly makes its own tag, and finishes the job in one run
#
# A tag pushed with GITHUB_TOKEN does NOT start another workflow run. GitHub
# does that on purpose, to stop a workflow from triggering itself forever. So
# the nightly cannot push a tag and leave: nothing would pick it up, and the
# release would never be built.
#
# Everything therefore happens in this one run. `prepare` decides the tag,
# creates it, pushes it, and hands it down through `needs.prepare.outputs.tag`.
# Downstream jobs must use that output and never `github.ref_name`, which on a
# scheduled run is the default branch, not a tag.
#
# The same property is what keeps this safe: because the pushed tag raises no
# event, there is no loop to guard against.
#
# Signing is wired up but optional, per platform and all-or-nothing: with no
# certificates the bundles go out unsigned and the run succeeds with a warning,
# with a full set they are signed, and with a partial set the job fails rather
# than ship something that looks signed and is not. See the guard steps in the
# bundle job for the secret names.
#
# Those guards are also where the signing environment is created, and that is
# not tidiness: an environment variable that exists and is empty asks Tauri to
# sign with an empty certificate, so the unsigned path has to leave the
# variables uncreated rather than pass them through blank. The nightly of
# 2026-09-28 failed on exactly that. The long note above the tauri-action step
# has the mechanism.
#
# ## Draft, then published by the workflow itself
#
# The release is created as a draft, every job attaches its assets to that one
# draft, and the final `publish` job takes it public. No person presses
# anything: review already happened on the pull request that put the code on the
# default branch, so a second approval here would add a button without adding a
# decision.
#
# The draft is therefore a staging area, not a review gate -- but it is load
# bearing. Publishing at creation time would put a release with no installers in
# front of everyone for the twenty-odd minutes the bundles take, notify every
# watcher, and leave an empty release behind whenever a build broke. Publishing
# last means a night that fails stays a draft and stays invisible.
name: Release

on:
  push:
    tags: ["v*"]
  schedule:
    # 22:00 UTC = 07:00 the next day in Seoul, so the release is waiting at the
    # start of the working day, carrying the day that just ended. Korea has no
    # daylight saving, so this is fixed all year.
    #
    # GitHub runs scheduled workflows on a best-effort basis and only on the
    # default branch. A busy hour can delay the start by minutes to tens of
    # minutes; workflow_dispatch is there for anything time-sensitive.
    - cron: "0 22 * * *"
  workflow_dispatch:

# Read by default; the jobs that need to write say so themselves. Today that
# is all of them -- prepare pushes the nightly tag, the rest create the release
# and upload to it -- but the next job added here starts out unprivileged.
permissions:
  contents: read

# One release at a time per ref. cancel-in-progress is deliberately FALSE:
# cancelling a release halfway through leaves a draft holding one platform's
# bundles and not the others, which is worse than making the second run wait.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  # Decide what is being released, on one cheap machine, so a typo or a quiet
  # day costs seconds rather than three platform builds.
  #
  # Two paths, one per trigger, each in its own step so neither has to carry the
  # other's conditionals:
  #   `tag`     a pushed tag: read the date out of it, validate the shape
  #   `nightly` schedule or dispatch: decide whether to release at all, then
  #             pick a tag and push it
  prepare:
    name: Decide the release
    runs-on: ubuntu-22.04
    # Writes: the nightly pushes the tag it just decided on.
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      # Whichever step ran; the other's outputs are empty strings.
      tag: ${{ steps.tag.outputs.tag || steps.nightly.outputs.tag }}
      date: ${{ steps.tag.outputs.date || steps.nightly.outputs.date }}
      title: ${{ steps.tag.outputs.title || steps.nightly.outputs.title }}
      seq: ${{ steps.tag.outputs.seq || steps.nightly.outputs.seq }}
      # Only the nightly can decide there is nothing to do. A pushed tag is a
      # person saying "release this", so it never skips.
      skip: ${{ steps.nightly.outputs.skip || 'false' }}
    steps:
      # fetch-depth: 0 for the whole history and every tag: `git rev-list
      # <last tag>..HEAD` has to be able to reach back to the previous release,
      # and the tag search below needs the tags to be present.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Parse the tag
        if: github.event_name == 'push'
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"

          # vYYYY-MM-DD, optionally .N for the Nth release of that day.
          if [[ ! "$tag" =~ ^v([0-9]{4})-([0-9]{2})-([0-9]{2})(\.([0-9]+))?$ ]]; then
            echo "::error title=Bad release tag::'$tag' is not a release tag." \
                 "Expected vYYYY-MM-DD, or vYYYY-MM-DD.N for the Nth release of that day." \
                 "Examples: v2026-09-27, v2026-09-27.2"
            exit 1
          fi

          y="${BASH_REMATCH[1]}"
          m="${BASH_REMATCH[2]}"
          d="${BASH_REMATCH[3]}"
          seq="${BASH_REMATCH[5]:-1}"
          date="$y-$m-$d"

          # The shape can be right and the date still impossible (v2026-13-40).
          # `date -d` normalises, so compare the round trip.
          if [ "$(date -u -d "$date" +%Y-%m-%d 2>/dev/null || true)" != "$date" ]; then
            echo "::error title=Bad release tag::'$tag' has the right shape but $date is not a real date." \
                 "Expected vYYYY-MM-DD with a calendar date that exists."
            exit 1
          fi

          if [ "$seq" = "0" ]; then
            echo "::error title=Bad release tag::'$tag' uses .0; the suffix counts from 1, and the first release of a day needs no suffix."
            exit 1
          fi

          # One release a day is the common case and gets a bare date. A second
          # needs something to tell it apart in the releases list.
          if [ "$seq" = "1" ]; then title="$date"; else title="$date ($seq)"; fi

          {
            echo "tag=$tag"
            echo "date=$date"
            echo "seq=$seq"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"

          echo "tag $tag -> release \"$title\""

      # The nightly, and the manual run that behaves like it.
      #
      # Order matters: decide whether to release BEFORE making a tag, or a quiet
      # day leaves a tag behind with no release attached to it.
      - name: Decide and tag the nightly
        id: nightly
        if: github.event_name != 'push'
        shell: bash
        run: |
          set -euo pipefail

          # Anything this workflow has released before -- git tags, not
          # releases, and still deliberately so now that success publishes.
          #
          # A night that failed leaves a draft but it DOES leave its tag. Asking
          # `gh release view` would skip such a night when counting "days already
          # released", so a retry the next day would count commits from two days
          # back and the release notes would double up. The tag is the record of
          # "this day was attempted"; that is the thing worth measuring from.
          last="$(git tag -l 'v[0-9]*' --sort=-creatordate | head -n 1)"

          if [ -n "$last" ]; then
            commits="$(git rev-list "${last}..HEAD" --count)"
            echo "last release tag: $last ($commits commit(s) since)"
          else
            commits=1
            echo "no release tag yet; treating this as the first release"
          fi

          if [ "$commits" -eq 0 ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Nothing to release::No commits on $(git rev-parse --abbrev-ref HEAD) since $last, so no release was created today. The build and test jobs are skipped too."
            echo "SKIPPING: HEAD is $last, nothing new."
            exit 0
          fi

          # The date is Seoul's, not UTC's. The cron fires at 22:00 UTC, which is
          # already 07:00 the next morning in Seoul -- so the KST date is the one
          # a person reads on the release when they open it over breakfast. Using
          # the UTC date would label that morning's release with yesterday.
          #
          # Assert the offset first. If the runner had no tz database, TZ would
          # be ignored silently and this would quietly produce the UTC date --
          # every nightly tag a day behind, with nothing in the log to say so.
          # Better to stop. (Korea has no DST, so +0900 holds all year.)
          offset="$(TZ=Asia/Seoul date +%z)"
          if [ "$offset" != "+0900" ]; then
            echo "::error title=Time zone database missing::TZ=Asia/Seoul resolved to '$offset', not +0900. Without tzdata the date below would silently be the UTC date, which is a day behind at this hour."
            exit 1
          fi
          date="$(TZ=Asia/Seoul date +%F)"
          echo "date in Seoul right now: $date (UTC: $(date -u +%F\ %T))"

          # First release of the day is the bare date; later ones take .2, .3 …
          # Checks tags and releases both: a draft release can exist for a tag
          # whose git tag was deleted, and reusing that name would collide.
          base="v$date"
          candidate="$base"
          seq=1
          while [ -n "$(git tag -l "$candidate")" ] \
                || gh release view "$candidate" >/dev/null 2>&1; do
            seq=$((seq + 1))
            candidate="${base}.${seq}"
            if [ "$seq" -gt 50 ]; then
              echo "::error title=Too many releases today::50 tags already exist for $date; refusing to keep counting."
              exit 1
            fi
          done
          tag="$candidate"
          if [ "$seq" = "1" ]; then title="$date"; else title="$date ($seq)"; fi
          echo "releasing as $tag -> \"$title\""

          # Create and push it here, in this run. A tag pushed with GITHUB_TOKEN
          # raises no workflow event (see the note at the top of this file), so
          # nothing else will ever pick it up -- the jobs after this one are the
          # only chance this tag has to become a release.
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "DIVIXI $title"
          git push origin "refs/tags/$tag"

          {
            echo "skip=false"
            echo "tag=$tag"
            echo "date=$date"
            echo "seq=$seq"
            echo "title=$title"
          } >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # One draft, made once, before anything builds.
  #
  # Why not `releaseDraft: true` on each matrix leg: a draft has no git tag, so
  # GitHub's get-release-by-tag cannot find it. Each leg would look for the
  # release, miss the draft the previous leg made, and create its own -- leaving
  # the Windows, macOS and Linux assets split across three drafts. Making it
  # here once and handing the id down is what keeps them together.
  create-release:
    name: Create the draft release
    needs: prepare
    if: needs.prepare.outputs.skip == 'false'
    runs-on: ubuntu-22.04
    # Writes: creates the draft.
    permissions:
      contents: write
    timeout-minutes: 10
    outputs:
      release_id: ${{ steps.draft.outputs.release_id }}
    steps:
      - name: Create or reuse the draft
        id: draft
        uses: actions/github-script@v9
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
          RELEASE_TITLE: ${{ needs.prepare.outputs.title }}
        with:
          script: |
            const tag = process.env.RELEASE_TAG;
            const name = process.env.RELEASE_TITLE;
            const { owner, repo } = context.repo;

            // Drafts are invisible to get-release-by-tag, so list and match by
            // hand. Includes drafts because the token has write access.
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner, repo, per_page: 100,
            });
            const sameTag = releases.filter((r) => r.tag_name === tag);

            // A published release under this tag means the tag has already
            // shipped. Re-running the workflow would rewrite assets people may
            // already have downloaded, so stop instead.
            // Still a guard now that publishing is automatic, and for the same
            // reason: not overwriting assets people may already have
            // downloaded. What changed is when it fires.
            //
            //   a night that partly failed   the release is still a draft
            //                                (publish never ran), so the branch
            //                                below reuses it -- "Re-run failed
            //                                jobs" finishes the release
            //   a night that succeeded       published, and this stops it
            //   "Re-run all jobs"            prepare runs again and picks the
            //                                next .N, so it makes a NEW release
            //                                rather than repairing this one
            const published = sameTag.find((r) => !r.draft);
            if (published) {
              core.setFailed(
                `${tag} is already published (${published.html_url}). ` +
                `Refusing to add assets to a released tag: someone may already have downloaded them. ` +
                `To finish a run that failed part-way, use "Re-run failed jobs" -- that keeps this tag ` +
                `and reuses its draft. "Re-run all jobs" would cut a new .N release instead.`,
              );
              return;
            }

            // A draft from an earlier failed run of the same tag: reuse it
            // rather than pile up duplicates.
            const draft = sameTag.find((r) => r.draft);
            if (draft) {
              core.info(`reusing draft ${draft.id} for ${tag}`);
              core.setOutput('release_id', String(draft.id));
              return;
            }

            const { data: made } = await github.rest.repos.createRelease({
              owner, repo,
              tag_name: tag,
              name,
              draft: true,
              prerelease: false,
              generate_release_notes: true,
              target_commitish: context.sha,
              // This body is written for readers, not for an editor: the
              // `publish` job releases it as-is, so there is no "replace this
              // line" step and nothing here may address a maintainer.
              //
              // `generate_release_notes: true` PRE-pends this body to the
              // notes it generates, so everything below lands above the commit
              // list -- which is the only place the signing warning gets read.
              body: [
                '### Nothing here is signed yet',
                '',
                'These installers carry no code-signing certificate, so both',
                'systems will try to stop you opening them. That is expected for',
                'now, not a sign that anything is wrong with the download.',
                '',
                '- **macOS** refuses an unsigned app outright, and DIVIXI has',
                '  never been verified on a Mac at all. To open it anyway:',
                '  right-click the app and choose *Open*, or clear the quarantine',
                '  flag with `xattr -d com.apple.quarantine /Applications/DIVIXI.app`.',
                '- **Windows** shows a SmartScreen warning. Choose *More info*,',
                '  then *Run anyway*.',
                '',
                'If you would rather not do either, build from source -- the',
                'README has the steps.',
                '',
                '---',
                '',
                `Built from \`${tag}\` (\`${context.sha}\`).`,
                'The version in the manifests is semver and moves on its own',
                'schedule; the release is named by date.',
              ].join('\n'),
            });
            core.info(`created draft ${made.id} for ${tag}`);
            core.setOutput('release_id', String(made.id));

  bundle:
    name: Bundle (${{ matrix.name }})
    needs: [prepare, create-release]
    if: needs.prepare.outputs.skip == 'false'
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    strategy:
      # Never abandon the other platforms because one failed: a release with
      # two of three installers is worth more than none, and the failure is
      # then visible per platform.
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            args: ""
          - name: macos
            os: macos-14
            # One bundle for both Intel and Apple Silicon: fewer downloads to
            # explain, and one fewer runner.
            args: "--target universal-apple-darwin"
            rust-target: universal-apple-darwin
          - name: linux
            os: ubuntu-22.04
            args: ""
    # Writes: tauri-action uploads the bundles to the draft.
    permissions:
      contents: write
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-${{ matrix.name }}

      # The universal macOS bundle needs both architectures' std.
      - name: Add the macOS universal target
        if: matrix.rust-target != ''
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      # Signing is all-or-nothing per platform, and a half-filled secret set
      # fails here rather than quietly producing an unsigned bundle that looks
      # like a signed one in the logs.
      #
      # macOS needs six secrets together:
      #   APPLE_CERTIFICATE            base64 of a "Developer ID Application" .p12
      #   APPLE_CERTIFICATE_PASSWORD   that .p12's password
      #   APPLE_SIGNING_IDENTITY       e.g. "Developer ID Application: NAME (TEAMID)"
      #   APPLE_ID                     the Apple ID used to notarise
      #   APPLE_PASSWORD               an app-specific password for that Apple ID
      #   APPLE_TEAM_ID                the ten-character team id
      #
      # Signed-but-not-notarised is deliberately NOT a state we ship: Gatekeeper
      # treats a Developer-ID-signed, un-notarised app worse than an unsigned
      # one, because it looks like it is trying to pass. So 0/6 or 6/6 only.
      #
      # Divixi now ships updater metadata/signatures, but macOS signing still
      # follows this all-or-nothing gate for the app bundle itself.
      - name: Resolve macOS signing mode
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail

          # One list, read twice below: counted first, then handed to the build.
          # Two copies of it would be two things to keep in step.
          names="APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY
                 APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID"

          set=0
          missing=""
          for name in $names; do
            if [ -n "${!name:-}" ]; then
              set=$((set + 1))
            else
              missing="$missing $name"
            fi
          done

          if [ "$set" -eq 6 ]; then
            echo "macOS signing: Developer ID + notarization (6/6 secrets set)."
            # Hand the Apple environment to the build HERE, and only in this
            # branch. That placement is the whole fix: the bundler reads every
            # one of these with `var_os`, so a variable that exists and is
            # empty asks it to sign with an empty certificate. A variable that
            # was never created is the only thing it reads as "not signing".
            #
            # Written with the multi-line delimiter form rather than KEY=VALUE:
            # APPLE_CERTIFICATE is base64 and may arrive wrapped across lines,
            # and a single-line write would truncate it at the first newline
            # and leave the rest of the file being parsed as more variables.
            for name in $names; do
              {
                echo "${name}<<__DIVIXI_SIGNING_ENV__"
                printf '%s\n' "${!name}"
                echo "__DIVIXI_SIGNING_ENV__"
              } >> "$GITHUB_ENV"
            done
            echo "handed 6 Apple variables to the build via \$GITHUB_ENV"
          elif [ "$set" -eq 0 ]; then
            echo "::warning title=Unsigned macOS bundle::No Apple secrets are set, so the .app and .dmg go out unsigned. Gatekeeper will refuse them on any machine that did not build them."
          else
            echo "::error title=Incomplete Apple signing secrets::$set of 6 Apple secrets are set. Signing needs all six or none -- a Developer-ID-signed but un-notarised bundle is worse for users than an unsigned one. Missing:$missing"
            exit 1
          fi

      # Windows is the same rule plus one extra condition: the two secrets are
      # not enough on their own. Tauri also needs `bundle > windows >
      # certificateThumbprint` (or a signCommand) in tauri.conf.json, or it
      # never invokes signtool and the installer comes out unsigned while the
      # secrets sit there looking like they did something.
      - name: Resolve Windows signing mode
        if: runner.os == 'Windows'
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          set=0
          [ -n "${WINDOWS_CERTIFICATE:-}" ] && set=$((set + 1)) || true
          [ -n "${WINDOWS_CERTIFICATE_PASSWORD:-}" ] && set=$((set + 1)) || true

          configured=$(node -e '
            const c = require("./src-tauri/tauri.conf.json");
            const w = (c.bundle && c.bundle.windows) || {};
            process.stdout.write(w.certificateThumbprint || w.signCommand ? "yes" : "no");
          ')
          echo "secrets set: $set/2 | tauri.conf.json signing configured: $configured"

          if [ "$set" -eq 2 ] && [ "$configured" = "yes" ]; then
            echo "Windows signing: configured -- but read the note below before trusting it."
            # Unreachable today (no secrets), and left honest rather than
            # tidied: Tauri reads NEITHER of these two names. Neither occurs
            # anywhere in tauri or tauri-action. Signing happens through
            # bundle.windows.certificateThumbprint, which needs the certificate
            # already in the machine store -- and no step here puts it there.
            echo "::warning title=Windows signing needs an import step::tauri.conf.json asks signtool for a certificate by thumbprint, but Tauri never reads WINDOWS_CERTIFICATE or WINDOWS_CERTIFICATE_PASSWORD (neither name exists in tauri or tauri-action). Add a step that imports the .pfx into the machine store before this build, or the installer ships unsigned."
          elif [ "$set" -eq 0 ] && [ "$configured" = "no" ]; then
            echo "::warning title=Unsigned Windows installer::No signing certificate, so SmartScreen will warn users until one is added."
          elif [ "$set" -eq 2 ] && [ "$configured" = "no" ]; then
            echo "::error title=Windows signing secrets are set but unused::Both WINDOWS_CERTIFICATE secrets exist, but tauri.conf.json has no bundle.windows.certificateThumbprint (or signCommand), so Tauri will never call signtool and the installer would ship unsigned. Add the config or remove the secrets."
            exit 1
          elif [ "$set" -eq 1 ]; then
            echo "::error title=Incomplete Windows signing secrets::1 of 2 secrets is set. Provide both WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD, or neither."
            exit 1
          else
            echo "::error title=Windows signing configured without secrets::tauri.conf.json asks for signing but no certificate secrets are set, so the build will fail inside signtool. Add the secrets or remove the config."
            exit 1
          fi

      # Uploads into the draft `create-release` made, by id. Per tauri-action's
      # docs, with `releaseId` set it does not consult `tagName`/`releaseName`
      # to find a release, so they are omitted -- and `tagName` is better left
      # out than passed: the docs also say that if it points at an existing
      # release, `releaseDraft` has to match that release's state, which is one
      # more thing to keep in step for no gain. The only documented cost of
      # omitting it is where `latest.json` points.
      #
      # Updater signing keys are passed only to this step to produce
      # `latest.json` and per-asset `.sig` files.
      #
      # This file used to pass all eight secrets here and say that "unset ones
      # arrive as empty strings, which tauri-action treats as absent". That was
      # wrong, and it is what broke the nightly of 2026-09-28: the macOS bundle
      # failed in `security import` with an empty certificate while the guard
      # step three above it had correctly reported 0/6 and warned.
      #
      # Nothing treats "" as absent. The bundler reads the Apple variables with
      # `std::env::var_os` (crates/tauri-bundler/src/bundle/macos/sign.rs), and
      # `var_os` returns Some("") for a variable that is set and empty, which is
      # indistinguishable from a real value:
      #
      #   security: SecKeychainItemImport: One or more parameters passed to a
      #   function were not valid.
      #   failed to bundle project: failed codesign application: failed to run
      #   command security import: failed to import keychain certificate
      #
      # APPLE_SIGNING_IDENTITY is a second, independent way in: the CLI does
      # `match var_os("APPLE_SIGNING_IDENTITY")` and only falls back to
      # bundle.macOS.signingIdentity for None, so an empty one asks for signing
      # under a nameless identity even with no certificate anywhere.
      #
      # So the guard step writes the six to $GITHUB_ENV inside its 6/6 branch
      # and nowhere else. On the unsigned path the variables do not exist, which
      # is the only state that means "do not sign". The guard must also stay
      # ABOVE this step: $GITHUB_ENV only reaches later steps.
      #
      # WINDOWS_CERTIFICATE and WINDOWS_CERTIFICATE_PASSWORD are gone for a
      # different reason -- nothing reads them. Neither name occurs anywhere in
      # tauri or in tauri-action. They come from Tauri's Windows signing guide,
      # where a separate step imports the certificate into the machine store and
      # Tauri finds it through bundle.windows.certificateThumbprint. Listing
      # them here only made them look load bearing.
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # action-v0.6.2, 2026-03-14
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Which release this binary came from, for the app's update check.
          # src-tauri/build.rs bakes it in; without it a build calls itself a
          # development build, which is the honest answer for a working copy.
          #
          # It must be `outputs.tag` (v2026-09-28). build.rs rejects the title
          # ("2026-09-28 (2)") and the date, and panics on the spot rather than
          # shipping a binary that reports a version nothing can parse. Set here
          # per step, never at the top of the workflow: ci.yml and a developer's
          # `npm run app` have to stay development builds.
          DIVIXI_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

  # divixi-server has no bundler: it is a bare binary a Linux box runs.
  # docs/divixi-server.md tells people to build it from source, so this is a
  # convenience, not the documented path.
  #
  # It does not wait for `bundle`, deliberately. It consumes nothing from it --
  # no outputs, no artifacts -- and only ever needed the draft's id, which comes
  # from `create-release`. The dependency was left from when this job was the
  # last one to attach an asset, and all it did on the night of 2026-09-28 was
  # make a broken macOS bundle cost the Linux server binary too. Nothing about
  # publishing gets looser: `publish` still names all four jobs, so a release
  # with a missing bundle still stays a draft.
  server:
    name: divixi-server (linux)
    needs: [prepare, create-release]
    if: needs.prepare.outputs.skip == 'false'
    # Writes: uploads the server binary to the draft.
    permissions:
      contents: write
    timeout-minutes: 30
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-build
        with:
          cache-key: release-server

      # tauri-build needs the frontend bundle even for the windowless binary:
      # it embeds the same dist/.
      - name: Build UI (required by tauri-build)
        run: npm run build

      - name: Build divixi-server
        # Same tag as the bundles get, for the same reason: the server reports
        # its build to the app that connects to it. See the note in the bundle
        # job -- `outputs.tag`, not the title, and never workflow-wide.
        env:
          DIVIXI_RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: cargo build --release -p orchestra-app --features server --bin divixi-server

      - name: Stage the binary
        run: |
          mkdir -p staging
          cp target/release/divixi-server "staging/divixi-server-${{ needs.prepare.outputs.date }}-x86_64-linux"

      # By release id, not by tag. `gh release upload` and softprops both find
      # the release by tag, which cannot work here: the release is a draft and a
      # draft has no git tag, so they would create a second one.
      - name: Upload to the draft release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
        with:
          script: |
            const fs = require('node:fs');
            const path = require('node:path');
            const release_id = Number(process.env.RELEASE_ID);
            const { owner, repo } = context.repo;

            const dir = 'staging';
            const files = fs.readdirSync(dir);
            if (files.length === 0) core.setFailed('nothing in staging/ to upload');

            // A re-run would otherwise hit "asset already exists".
            const { data: existing } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });

            for (const name of files) {
              const old = existing.find((a) => a.name === name);
              if (old) {
                core.info(`replacing existing asset ${name}`);
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: old.id });
              }
              const data = fs.readFileSync(path.join(dir, name));
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id, name, data,
                headers: {
                  'content-type': 'application/octet-stream',
                  'content-length': data.length,
                },
              });
              core.info(`uploaded ${name} (${data.length} bytes)`);
            }

  # The last step, and the only one that makes anything public.
  #
  # Publishing is automatic because the human review already happened: nothing
  # reaches the default branch except through a reviewed pull request, so asking
  # for a second approval here would only add a button nobody benefits from
  # pressing. The draft is a staging area for assets, not a review gate.
  #
  # It has to come after every job that attaches an asset -- the three platform
  # bundles and the Linux server binary -- which is why it names both `bundle`
  # and `server`. They no longer run one after the other (`server` stopped
  # waiting for `bundle`), so `needs` is the only thing ordering this job now.
  #
  # Note there is NO `always()` here, and that is the safety property. A job
  # whose `needs` failed or was cancelled is skipped by default, so a night
  # where one platform broke never publishes: the release stays a draft, holding
  # whatever did build, invisible to anyone watching the repository. Adding
  # `always()` would publish half a release.
  publish:
    name: Publish the release
    needs: [prepare, create-release, bundle, server]
    if: needs.prepare.outputs.skip == 'false'
    # Writes: flips the release out of draft.
    permissions:
      contents: write
    timeout-minutes: 10
    runs-on: ubuntu-22.04
    steps:
      - name: Un-draft the release
        uses: actions/github-script@v9
        env:
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        with:
          script: |
            const release_id = Number(process.env.RELEASE_ID);
            const tag = process.env.RELEASE_TAG;
            const { owner, repo } = context.repo;

            // Check the assets are really there before going public. The job
            // graph already implies it, but a silent upload failure would
            // otherwise publish an empty release, and that is the one outcome
            // this whole arrangement exists to prevent.
            const { data: assets } = await github.rest.repos.listReleaseAssets({
              owner, repo, release_id, per_page: 100,
            });
            if (assets.length === 0) {
              core.setFailed(
                `${tag} has no assets attached; refusing to publish an empty release. ` +
                `Look at the bundle and server jobs.`,
              );
              return;
            }
            core.info(`${assets.length} asset(s): ${assets.map((a) => a.name).join(', ')}`);

            // make_latest is a STRING in this API, not a boolean. Passing a
            // boolean silently skips it and the release gets no "Latest" badge.
            const { data } = await github.rest.repos.updateRelease({
              owner, repo, release_id,
              draft: false,
              make_latest: 'true',
            });
            core.info(`published ${data.html_url}`);
            core.summary
              .addHeading(`Released ${data.name}`, 2)
              .addLink(data.html_url, data.html_url)
              .addRaw(`\n\n${assets.length} asset(s) attached.`)
              .write();
